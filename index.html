<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pokémon Type Filter</title>
<style>
    :root {
        --ink: #19212b;
        --muted: #64707d;
        --paper: #fffdf8;
        --line: #e5e1d8;
        --coral: #e85d4a;
        --coral-dark: #b83b2e;
        --mint: #d9f0e4;
        --sky: #dceefa;
        --shadow: 0 18px 45px rgba(50, 46, 36, 0.12);
    }

    * { box-sizing: border-box; }

    body {
        min-height: 100vh;
        margin: 0;
        color: var(--ink);
        background:
            radial-gradient(circle at 8% 12%, rgba(232, 93, 74, 0.13) 0 11rem, transparent 11.1rem),
            radial-gradient(circle at 95% 88%, rgba(67, 155, 130, 0.13) 0 15rem, transparent 15.1rem),
            #f5f1e8;
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    }

    main { width: min(100% - 2rem, 980px); margin: 0 auto; padding: 3rem 0 4rem; }

    .hero { display: flex; align-items: end; justify-content: space-between; gap: 2rem; margin-bottom: 1.5rem; }
    .eyebrow { margin: 0 0 .65rem; color: var(--coral-dark); font-size: .74rem; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; }
    h1 { max-width: 620px; margin: 0; font-family: Georgia, serif; font-size: clamp(2.5rem, 7vw, 5.2rem); line-height: .95; letter-spacing: -.04em; }
    .hero-mark { display: grid; width: 74px; height: 74px; flex: 0 0 auto; place-items: center; border: 8px solid var(--ink); border-radius: 50%; background: var(--coral); box-shadow: 5px 5px 0 var(--ink); font-size: 2rem; }

    .filter-panel { padding: clamp(1.25rem, 4vw, 2rem); border: 1px solid var(--line); border-radius: 18px; background: var(--paper); box-shadow: var(--shadow); }
    .filter-heading { margin: 0 0 .3rem; font-family: Georgia, serif; font-size: 1.55rem; }
    .filter-copy { margin: 0 0 1.3rem; color: var(--muted); }
    .filter-form { display: grid; grid-template-columns: 1fr 1fr auto auto; align-items: end; gap: .8rem; }
    label { display: block; margin-bottom: .4rem; font-size: .82rem; font-weight: 800; }
    select, button { width: 100%; min-height: 48px; border-radius: 10px; font: inherit; font-weight: 700; }
    select { padding: .7rem .8rem; border: 2px solid var(--line); color: var(--ink); background: #fff; cursor: pointer; }
    select:focus-visible, button:focus-visible { outline: 3px solid #f4b942; outline-offset: 3px; }
    button { padding: .7rem 1.15rem; border: 2px solid var(--ink); color: #fff; background: var(--coral); cursor: pointer; transition: transform .18s ease, background .18s ease; }
    button:hover { background: var(--coral-dark); transform: translateY(-2px); }
    .button-secondary { color: var(--ink); background: transparent; }
    .button-secondary:hover { color: var(--ink); background: var(--mint); }

    .results-header { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; margin: 2.5rem 0 1rem; }
    #count { margin: 0; font-family: Georgia, serif; font-size: 1.7rem; }
    .hint { margin: 0; color: var(--muted); font-size: .86rem; }
    #results { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: .8rem; }
    .pokemon { display: flex; align-items: center; gap: .85rem; min-height: 86px; padding: 1rem; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); box-shadow: 0 5px 15px rgba(50, 46, 36, 0.05); animation: rise .35s both; }
    .pokemon-number { display: grid; width: 42px; height: 42px; flex: 0 0 auto; place-items: center; border-radius: 50%; color: #24604c; background: var(--mint); font-size: .72rem; font-weight: 800; }
    .pokemon-info { min-width: 0; }
    .pokemon-name { display: block; overflow: hidden; font-family: Georgia, serif; font-size: 1.1rem; font-weight: 700; text-overflow: ellipsis; text-transform: capitalize; white-space: nowrap; }
    .pokemon-types { display: block; margin-top: .2rem; color: var(--muted); font-size: .78rem; text-transform: capitalize; }
    .empty { grid-column: 1 / -1; padding: 2rem; border: 1px dashed #bbb4a5; border-radius: 12px; color: var(--muted); text-align: center; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    @media (max-width: 680px) {
        main { width: min(100% - 1.25rem, 520px); padding: 1.5rem 0 2.5rem; }
        .hero { align-items: start; }
        .hero-mark { width: 56px; height: 56px; border-width: 6px; font-size: 1.35rem; box-shadow: 4px 4px 0 var(--ink); }
        .filter-form { grid-template-columns: 1fr 1fr; }
        .filter-form button { grid-column: span 1; }
        .results-header { display: block; margin-top: 2rem; }
        .hint { margin-top: .3rem; }
    }

    @media (max-width: 390px) {
        .filter-form { grid-template-columns: 1fr; }
        .filter-form button { grid-column: auto; }
        .hero-mark { display: none; }
    }
</style>
</head>
<body>
<main>
    <header class="hero">
        <div>
            <p class="eyebrow">Pokédex field guide</p>
            <h1>Find your next Pokémon combo.</h1>
        </div>
        <div class="hero-mark" aria-hidden="true">◓</div>
    </header>

    <section class="filter-panel" aria-labelledby="filter-heading">
        <h2 class="filter-heading" id="filter-heading">Build a type search</h2>
        <p class="filter-copy">Choose one or two types to narrow the full Pokédex.</p>
        <form class="filter-form" id="filterForm">
            <div>
                <label for="type1">Primary type</label>
                <select id="type1">
                    <option value="">Any type</option>
                </select>
            </div>
            <div>
                <label for="type2">Secondary type</label>
                <select id="type2">
                    <option value="none">None (pure type)</option>
                    <option value="">Any type</option>
                </select>
            </div>
            <button type="submit" id="filterBtn">Show matches</button>
            <button type="button" class="button-secondary" id="resetBtn">Reset</button>
        </form>
    </section>

    <section aria-live="polite" aria-atomic="true">
        <div class="results-header">
            <h2 id="count">Loading Pokémon...</h2>
            <p class="hint">Results update after you search.</p>
        </div>
        <div id="results"></div>
    </section>
</main>

<script>
async function loadPokemon() {
    const embeddedData = JSON.parse(document.getElementById("pokemon-data").textContent);
    return Array.isArray(embeddedData) ? embeddedData : embeddedData.value;
}

function getAllTypes(pokemonList) {
    const types = new Set();
    pokemonList.forEach(p => p.types.forEach(t => types.add(t)));
    return Array.from(types).sort();
}

function formatTypeName(type) {
    return type.charAt(0).toUpperCase() + type.slice(1);
}

function populateTypeDropdowns(types) {
    const t1 = document.getElementById("type1");
    const t2 = document.getElementById("type2");

    types.forEach(type => {
        const opt1 = document.createElement("option");
        opt1.value = type;
        opt1.textContent = formatTypeName(type);
        t1.appendChild(opt1);

        const opt2 = document.createElement("option");
        opt2.value = type;
        opt2.textContent = formatTypeName(type);
        t2.appendChild(opt2);
    });
}

function filterPokemon(pokemonList, type1, type2) {
    return pokemonList.filter(p => {
        const pTypes = p.types;

        if (type1 && !pTypes.includes(type1)) return false;
        if (type2 === "none") return pTypes.length === 1;
        if (type2 && !pTypes.includes(type2)) return false;

        return true;
    });
}

function displayResults(results) {
    const countEl = document.getElementById("count");
    const resultsEl = document.getElementById("results");

    countEl.textContent = `${results.length} Pokémon found`;
    resultsEl.innerHTML = "";

    if (results.length === 0) {
        resultsEl.innerHTML = '<p class="empty">No matches yet. Try a different type pairing.</p>';
        return;
    }

    results.forEach(p => {
        const div = document.createElement("div");
        div.className = "pokemon";
        div.innerHTML = `
            <span class="pokemon-number">#${String(p.pokedex_number).padStart(3, "0")}</span>
            <span class="pokemon-info">
                <span class="pokemon-name">${p.name}</span>
                <span class="pokemon-types">${p.types.join(" / ")}</span>
            </span>`;
        resultsEl.appendChild(div);
    });
}

(async function init() {
    const pokemonList = await loadPokemon();
    const types = getAllTypes(pokemonList);
    populateTypeDropdowns(types);

    document.getElementById("filterForm").onsubmit = (event) => {
        event.preventDefault();
        const type1 = document.getElementById("type1").value;
        const type2 = document.getElementById("type2").value;

        const results = filterPokemon(pokemonList, type1, type2);
        displayResults(results);
    };

    document.getElementById("resetBtn").onclick = () => {
        document.getElementById("type1").value = "";
        document.getElementById("type2").value = "";
        displayResults(pokemonList);
    };

    displayResults(pokemonList);
})();
</script>
